# SUKHOTHAI 2050 V6 — dedicated test site (not the V5 production site)
[build]
  publish = "site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
